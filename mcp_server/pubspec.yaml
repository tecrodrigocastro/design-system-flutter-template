name: mcp_server
description: >-
  An MCP server that exposes the design_system package's component catalog,
  design tokens, and dartdoc search index to AI coding assistants.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  analyzer: ^14.1.0
  dart_mcp: ^0.5.2
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  stream_channel: ^2.1.4
  test: ^1.25.6

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  design_system:
    name: design_system (analyze, test, dartdoc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design_system
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate API docs
        run: dart doc .

  widgetbook:
    name: widgetbook (analyze, test)
    needs: design_system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widgetbook
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate use case directory registry
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  mcp_server:
    name: mcp_server (analyze, test)
    needs: design_system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp_server
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test
